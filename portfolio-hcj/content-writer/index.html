<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Content Writer | Sahrul Fatkhur Rozi</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #101116;
        color: #ffffff;
        min-height: 100vh;
        padding: 50px 20px;
      }

      .container {
        max-width: 850px;
        margin: auto;
      }

      h1 {
        text-align: center;
        font-size: 42px;
        margin-bottom: 15px;
      }

      .intro {
        text-align: center;
        color: #bbbbbb;
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .works {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .work {
        background: #1b1c23;
        border: 1px solid #30313a;
        border-radius: 15px;
        padding: 25px;
      }

      .work h2 {
        font-size: 22px;
        margin-bottom: 10px;
      }

      .work p {
        color: #bbbbbb;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .work a {
        display: inline-block;
        background: #6c45a8;
        color: #ffffff;
        text-decoration: none;
        padding: 11px 20px;
        border-radius: 8px;
        font-weight: 600;
      }

      .work a:hover {
        background: #8157c2;
      }

      .back-container {
        text-align: center;
        margin-top: 40px;
      }

      .back {
        color: #cccccc;
        text-decoration: none;
        font-size: 15px;
      }

      .back:hover {
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Content Writer</h1>

      <p class="intro">
        Kumpulan karya penulisan artikel dan konten informatif untuk berbagai
        platform digital.
      </p>

      <div class="works">
        <!-- KUMPARAN -->
        <div class="work">
          <h2>Artikel Kumparan</h2>

          <p>
            Kumpulan artikel yang saya tulis dan publikasikan melalui platform
            Kumparan.
          </p>

          <a
            href="https://kumparan.com/sahrul-fr07"
            target="_blank"
            rel="noopener noreferrer"
          >
            Lihat Profil Kumparan
          </a>
        </div>
      </div>

      <!-- KEMBALI KE CARD CONTENT WRITER -->
      <div class="back-container">
        <a href="../../index.htm#content-writer" class="back">
          Kembali ke Portfolio
        </a>
      </div>
    </div>
  </body>
</html>
